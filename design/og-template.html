<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <title>OG card template (design source, not a page)</title>
  <!--
    Source for the 1200×630 Open Graph cards in assets/img/og/.
    Render with design/README.md. The card has no photo and no AI imagery,
    only type, the navy palette and the route motif.
  -->
  <style>
    @font-face { font-family: 'Fraunces'; src: url('/assets/fonts/fraunces-latin-display.woff2') format('woff2'); font-weight: 400 700; font-display: block; }
    @font-face { font-family: 'Inter'; src: url('/assets/fonts/inter-latin-var.woff2') format('woff2'); font-weight: 100 900; font-display: block; }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body {
      position: relative;
      background: #0F2A4A;
      color: #F8FAFC;
      font-family: 'Inter', system-ui, sans-serif;
    }
    .dots {
      position: absolute; inset: 0;
      background-image: radial-gradient(rgba(248, 250, 252, 0.09) 1.2px, transparent 1.4px);
      background-size: 32px 32px;
    }
    .motif { position: absolute; right: -150px; top: -70px; width: 660px; height: 660px; opacity: 0.2; }
    .rule { position: absolute; left: 72px; top: 76px; width: 56px; height: 4px; border-radius: 2px; background: #2EC4B6; }
    .wrap { position: absolute; left: 72px; right: 72px; top: 124px; bottom: 136px; display: flex; flex-direction: column; justify-content: center; }
    .kicker { font-size: 20px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #2EC4B6; }
    .title { margin: 22px 0 0; max-width: 1000px; font-family: 'Fraunces', Georgia, serif; font-weight: 500; font-size: 68px; line-height: 1.06; letter-spacing: -0.02em; color: #F8FAFC; }
    .title.long { font-size: 54px; }
    .sub { margin: 26px 0 0; max-width: 920px; font-size: 26px; line-height: 1.4; color: #B9C7D6; }
    .foot { position: absolute; left: 72px; right: 72px; bottom: 56px; display: flex; align-items: center; justify-content: space-between; font-size: 20px; color: #B9C7D6; }
    .brand { display: flex; align-items: center; gap: 16px; }
    .brand img { width: 52px; height: 52px; border-radius: 12px; }
    .brand strong { display: block; font-size: 22px; font-weight: 600; color: #F8FAFC; }
  </style>
</head>
<body>
  <div class="dots"></div>
  <img class="motif" src="/assets/img/route-motif.svg" alt="">
  <div class="rule"></div>
  <div class="wrap">
    <div class="kicker" id="kicker"></div>
    <h1 class="title" id="title"></h1>
    <p class="sub" id="sub"></p>
  </div>
  <div class="foot">
    <div class="brand">
      <img src="/assets/brand/icon-512.png" alt="">
      <div><strong>Atikul Islam Rabbi</strong>Social Media Security &amp; Recovery</div>
    </div>
    <div>atikulislam.me</div>
  </div>
  <script>
    (function () {
      var p = new URLSearchParams(window.location.search);
      var title = p.get('title') || '';
      document.getElementById('kicker').textContent = p.get('kicker') || '';
      var h = document.getElementById('title');
      h.textContent = title;
      if (title.length > 60) h.classList.add('long');
      document.getElementById('sub').textContent = p.get('sub') || '';
    }());
  </script>
</body>
</html>
